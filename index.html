<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="description" content="OmniConvert — convert, preview and manage files right in your browser." />
    <title>OmniConvert</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/icon-oc.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-oc-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("omni-theme");
        var dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
        document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#000000" : "#f5f5f7");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
